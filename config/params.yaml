# Hybrid A* parameters. Flat "key: value", numbers only.
# Missing keys keep the defaults in PlannerConfig (types.hpp); unknown keys
# are an error.

# vehicle
wheel_base: 2.5          # m
max_steer: 0.45          # rad, so R_min = 2.5 / tan(0.45) = 5.17 m
vehicle_length: 4.5      # m
vehicle_width: 2.0       # m
rear_axle_to_center: 1.25  # m, poses are the rear axle; footprint centre is this far ahead

# search
step_size: 1.0           # m per motion primitive
collision_step: 0.2      # m between collision checks along a primitive
steer_samples: 3         # steering angles from -max_steer to +max_steer
xy_resolution: 0.1       # m, cell size of the closed set
heading_bins: 24         # 15 degrees each
max_expansions: 1000000  # give up after this many
goal_pos_tol: 0.5        # m, only used when analytic expansion is off
goal_heading_tol: 0.3    # rad, same

# analytic expansion (Reeds-Shepp shot to the goal)
analytic_expansion_interval: 10    # try every N expansions, 0 = off
analytic_expansion_distance: 10.0  # m, try on every expansion when this close
rs_sample_step: 0.1                # m between collision checks on the curve

# costs
reverse_penalty: 10.0          # multiplier on distance driven in reverse
direction_change_cost: 150.0   # added at every forward/reverse switch
steer_cost: 1.0                # per rad of steering
steer_change_cost: 5.0         # per rad of change in steering
heuristic_weight: 50.0         # 1 = plain A*, larger = greedier
