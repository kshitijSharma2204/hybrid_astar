# Hybrid A* parameters. Flat "key: value", numbers only.
# Missing keys keep the defaults in PlannerConfig (types.hpp); unknown keys
# are an error.

# vehicle
wheel_base: 2.5          # m
max_steer: 0.45          # rad, so R_min = 2.5 / tan(0.45) = 5.17 m
vehicle_length: 4.5      # m
vehicle_width: 2.0       # m
rear_axle_to_center: 1.25  # m, poses are the rear axle; footprint centre is this far ahead

# search
step_size: 0.5           # m per motion primitive
collision_step: 0.2      # m between collision checks along a primitive
steer_samples: 5         # steering angles from -max_steer to +max_steer
xy_resolution: 0.5       # m, cell size of the closed set
heading_bins: 72         # 5 degrees each
max_expansions: 200000   # give up after this many
collision_mode: 2        # 0 exact, 1 covering circles, 2 circles then exact
collision_circles: 4     # discs along the centre line for the circle check
goal_pos_tol: 0.5        # m, only used when analytic expansion is off
goal_heading_tol: 0.3    # rad, same

# analytic expansion (Reeds-Shepp shot to the goal)
analytic_expansion_interval: 10    # try every N expansions, 0 = off
analytic_expansion_distance: 10.0  # m, try on every expansion when this close
rs_sample_step: 0.1                # m between collision checks on the curve

# shortcutting (Reeds-Shepp curves across each run between cusps, see shortcut.hpp)
shortcut_enabled: 1
shortcut_spacing: 0.5        # m between the poses that can be joined

# smoothing (gradient descent on each run between cusps, see smoother.hpp)
smooth_enabled: 1
smooth_iterations: 300
smooth_spacing: 0.5          # m between the control points that get moved
smooth_rate: 0.5             # gradient step, as a fraction of the largest stable one
smooth_w_smooth: 1.0         # weight on squared second differences
smooth_w_obstacle: 0.05      # weight on getting closer than smooth_obstacle_dmax
smooth_w_curvature: 200.0    # weight on turning tighter than 1 / R_min
smooth_w_length: 1.0         # weight on keeping control points evenly spaced
smooth_obstacle_dmax: 1.0    # m
smooth_curvature_limit: 1.05 # a smoothed run is kept only if it turns no tighter than this / R_min

# costs
reverse_penalty: 1.5           # multiplier on distance driven in reverse
direction_change_cost: 5.0     # added at every forward/reverse switch
steer_cost: 0.0                # per rad of steering, per primitive
steer_change_cost: 0.0         # per rad of change in steering, per primitive
heuristic_weight: 2.0          # 1 = plain A*, larger = greedier
rs_heuristic: 1                # 1: h = max(2D distance, Reeds-Shepp length), 0: 2D only
