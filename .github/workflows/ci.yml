name: build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ libompl-dev libnanoflann-dev libeigen3-dev \
            libgtest-dev python3-dev python3-venv \
            libboost-serialization-dev libboost-filesystem-dev libboost-system-dev

      - name: Python venv
        run: tools/setup_venv.sh

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPython_EXECUTABLE=$PWD/.venv/bin/python
          cmake --build build

      - name: C++ tests
        run: ctest --test-dir build --output-on-failure

      - name: Python tests
        run: .venv/bin/python -m pytest -q python/tests
